<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html">
<h:head>
    <title>Belajar JSF dan Bootstrap 5</title>
    
    <h:outputStylesheet
        library="bootstrap"
        name="css/bootstrap.min.css" />
</h:head>

<h:body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <h:link outcome="index"
                    value="Belajar JSF"
                    styleClass="navbar-brand fw-bold" />
            
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Buka navigasi">

                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarMenu">
                <div class="navbar-nav ms-auto">
                    <h:link outcome="index"
                            value="Halaman Utama"
                            styleClass="nav-link active" />

                    <h:link outcome="tentang"
                            value="Tentang Bimbel"
                            styleClass="nav-link" />

                    <h:link outcome="about"
                                value="About Me"
                                styleClass="nav-link" />

                    <h:link outcome="program"
                                    value="Program"
                                    styleClass="nav-link" />

                    <h:link outcome="guru"
                                    value="Guru"
                                    styleClass="nav-link" />
                </div>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <div class="card shadow">
            <div class="card-body">
                <h1 class="text-primary">Belajar JSF</h1>
                <p class="text-secondary">
                    Halaman JSF pertama menggunakan Bootstrap 5.
                </p>

                <h:form>
                    <div class="mb-3">
                        <h:outputLabel for="nama"
                                       value="Nama"
                                       styleClass="form-label" />

                        <h:inputText id="nama"
                                     value="#{haloBean.nama}"
                                     styleClass="form-control" />
                    </div>

                    <h:commandButton value="Tampilkan"
                                     action="#{haloBean.tampilkan}"
                                     styleClass="btn btn-primary" />
                    
                    <h:panelGroup layout="block"
                                  styleClass="alert alert-success alert-dismissible fade show mt-3"
                                  rendered="#{not empty haloBean.pesan}">
                        
                        <h:outputText value="#{haloBean.pesan}"/>
                        
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Tutup">
                        </button>                        
                    </h:panelGroup>
                </h:form>
            </div>
        </div>
    </div>
    
    <h:outputScript 
        library="bootstrap"
        name="js/bootstrap.bundle.min.js"/>
</h:body>
</html>
